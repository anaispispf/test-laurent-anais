titre: "Fréquentation touristique - Décembre 2025"
mois: "Janvier 2026"
collection: "Points Conjoncture"
numeropubli: "1517"
abstract: "Au mois de décembre 2025, la fréquentation touristique diminue de 3,4 % sur un an pour s’établir à 21 454 touristes. Ce résultat s’explique par la contraction des effectifs en provenance d’Amérique du Nord (-2,5 %), de France hexagonale (- 4,9 %), du Pacifique (- 8,8 %) et d’Asie (- 22,2 %). La baisse sur ces quatre marchés contribue pour - 4,9 points à l’évolution globale de la fréquentation touristique et concerne essentiellement les touristes en hébergement terrestre marchand ou non marchand. Sur les douze mois de 2025, la Polynésie française a reçu la visite de 281 227 touristes, soit une augmentation de 6,6 % par rapport à 2024 et le plus haut niveau de fréquentation touristique jamais mesuré."
